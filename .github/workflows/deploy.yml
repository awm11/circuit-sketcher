            <ArrowHead
              x={currentArrowOffset + 6}
              y={0}
              angle={0}
              scale={1.5}
            />
          )}
          {currentArrow === "left" && (
            <ArrowHead
              x={currentArrowOffset - 6}
              y={0}
              angle={180}
              scale={1.5}
