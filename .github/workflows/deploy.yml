                aria-label="Edit actions"
                style={{
                  display: "inline-flex",
                  alignItems: "center",
                  gap: "4px",
                  padding: "4px",
                  border: "1px solid #eadfce",
                  borderRadius: "9px",
                  background: "#fbf7f1",
                }}
              >
                <button
                  onClick={undoLastAction}
                  disabled={!undoHistory.length}
                  title="Undo (Ctrl/Cmd+Z)"
                >
                  Undo
                </button>
                <button
                  onClick={rotateSelected}
                  disabled={
                    selectedComponentIds.length > 1
                      ? false
                      : !selectedComponent ||
                        selectedComponent.type === "label"
                  }
                  title={
                    selectedComponentIds.length > 1
                      ? "Rotate selected components 90° around their centre"
                      : "Rotate 90°"
                  }
                >
                  Rotate ↻
                </button>
                <button
                  onClick={duplicateSelected}
                  disabled={!selectedComponent}
                >
                  Duplicate
                </button>
                <button
                  onClick={removeSelected}
                  disabled={!selected}
                >
                  Delete
                </button>
                <button
                  onClick={clearCanvas}
                  disabled={!components.length}
                >
                  Clear
                </button>
              </div>
            </div>
          </div>

          {mode === "wire" && wireStart && (
            <div
              aria-live="polite"
              style={{
                position: "absolute",
                top: "64px",
                left: "50%",
                zIndex: 8,
                pointerEvents: "none",
                transform: "translateX(-50%)",
                background: "#2563eb",
                color: "white",
                border: "3px solid white",
                borderRadius: "14px",
                padding: "12px 20px 11px",
                minWidth: "300px",
                maxWidth: "calc(100% - 40px)",
                textAlign: "center",
                fontWeight: 850,
                fontSize: "20px",
                lineHeight: 1.15,
                letterSpacing: "0.02em",
              }}
            >
              Press{" "}
              <span
                style={{
                  display: "inline-block",
                  margin: "0 3px",
                  padding: "3px 9px",
                  borderRadius: "7px",
                  background: "white",
                  color: "#1747a6",
                  fontSize: "0.9em",
                  letterSpacing: "0.06em",
                  boxShadow: "inset 0 -2px 0 rgba(23, 71, 166, 0.18)",
                }}
              >
                SPACE
              </span>{" "}
              to flip the corner
            </div>
          )}

          <div
            ref={canvasViewportRef}
            className="svg-wrap"
            style={{
              overflow: "auto",
              display: "flex",
              alignItems: zoom < 1 ? "center" : "flex-start",
              justifyContent: zoom < 1 ? "center" : "flex-start",
            }}
          >
            <div
              style={{
                width: `${zoom * 100}%`,
                height: `${zoom * 100}%`,
                minWidth: `${zoom * 100}%`,
                minHeight: `${460 * zoom}px`,
                flex: "0 0 auto",
              }}
            >
              <svg
                ref={svgRef}
                className={`drawing-canvas mode-${mode}`}
                viewBox={`0 0 ${WIDTH} ${HEIGHT}`}
                style={{ minHeight: 0 }}
              onDragOver={(event) => event.preventDefault()}
              onDrop={handleDrop}
              onPointerMove={handlePointerMove}
              onPointerUp={endPointerAction}
              onPointerCancel={cancelPointerAction}
              onPointerDown={(event) => {
                if (event.target === event.currentTarget) {
                  if (!startMarqueeSelection(event)) {
                    clearSelectionOrWire();
                  }
                }
              }}
              role="img"
              aria-label="circuit diagram drawing canvas"
            >
              <defs data-editor-only="true">
                <pattern
                  id="smallGrid"
                  width={GRID}
                  height={GRID}
                  patternUnits="userSpaceOnUse"
                >
                  <path
                    d={`M ${GRID} 0 L 0 0 0 ${GRID}`}
                    fill="none"
                    stroke="#dce6f2"
                    strokeWidth="0.6"
                  />
                </pattern>
                <pattern
                  id="grid"
                  width={GRID * 5}
                  height={GRID * 5}
                  patternUnits="userSpaceOnUse"
                >
                  <rect
                    width={GRID * 5}
                    height={GRID * 5}
                    fill="url(#smallGrid)"
                  />
                  <path
                    d={`M ${GRID * 5} 0 L 0 0 0 ${GRID * 5}`}
                    fill="none"
                    stroke="#c8d7e8"
                    strokeWidth="1"
                  />
                </pattern>
              </defs>

              {showGrid && (
                <rect
                  data-editor-only="true"
                  width="100%"
                  height="100%"
                  fill="url(#grid)"
                  pointerEvents="none"
                />
              )}

              <g className="wire-layer">
                {wires.map((wire) => {
                  const fromComponent = componentMap.get(
                    wire.from.componentId
                  );
                  const toComponent = componentMap.get(wire.to.componentId);

                  if (!fromComponent || !toComponent) return null;

                  const from = getPortPosition(
                    fromComponent,
                    wire.from.port
                  );
                  const to = getPortPosition(toComponent, wire.to.port);
                  const sharedDirection = getSharedPortDirection(
                    fromComponent,
                    wire.from.port,
                    toComponent,
                    wire.to.port
                  );
                  const liveCDirection =
                    wire.route === "c-shape" && sharedDirection
                      ? directionToKey(sharedDirection)
                      : wire.cDirection;
                  const geometry = getWireGeometry(
                    from,
                    to,
                    wire.route,
                    liveCDirection,
                    wire.cOffset
                  );
                  const path = geometry.path;
                  const currentArrows = getDrawnWireCurrentArrows(
                    wire,
                    geometry,
                    fromComponent,
                    toComponent
                  );
                  const isSelected =
                    selected?.kind === "wire" && selected.id === wire.id;

                  return (
                    <g key={wire.id}>
                      <path
                        d={path}
                        fill="none"
                        stroke="currentColor"
                        strokeWidth="2.4"
                        strokeLinecap="butt"
                        strokeLinejoin="miter"
                      />
                      {currentArrows.map((arrow, index) => (
                        <ArrowHead
                          key={`${wire.id}-current-${index}`}
                          x={arrow.x}
                          y={arrow.y}
                          angle={arrow.angle}
                          scale={1.5}
                        />
                      ))}

                      <path
                        data-editor-only="true"
                        d={path}
                        fill="none"
                        stroke={isSelected ? "#2563eb" : "transparent"}
                        strokeWidth={isSelected ? "12" : "28"}
                        opacity={isSelected ? "0.28" : "1"}
                        vectorEffect="non-scaling-stroke"
                        pointerEvents="stroke"
                        className="wire-hit"
                        onPointerDown={(event) =>
                          selectWire(event, wire.id)
                        }
                      />

                      {isSelected && geometry.handle && (
                        <g data-editor-only="true">
                          <rect
                            x={geometry.handle.x - 14}
                            y={geometry.handle.y - 14}
                            width="28"
                            height="28"
                            fill="transparent"
                            pointerEvents="all"
                            style={{
                              cursor:
                                geometry.handle.axis === "x"
                                  ? "ew-resize"
                                  : "ns-resize",
                            }}
                            onPointerDown={(event) =>
                              startWireHandleDrag(
                                event,
                                wire,
                                geometry.handle
                              )
                            }
                          />
                          <rect
                            x={geometry.handle.x - 7}
                            y={geometry.handle.y - 7}
                            width="14"
                            height="14"
                            rx="3"
                            fill="white"
                            stroke="#2563eb"
                            strokeWidth="2"
                            vectorEffect="non-scaling-stroke"
                            pointerEvents="none"
                          />
                          <line
                            x1={
                              geometry.handle.axis === "x"
                                ? geometry.handle.x - 3
                                : geometry.handle.x
                            }
                            y1={
                              geometry.handle.axis === "x"
                                ? geometry.handle.y
                                : geometry.handle.y - 3
                            }
                            x2={
                              geometry.handle.axis === "x"
                                ? geometry.handle.x + 3
                                : geometry.handle.x
                            }
                            y2={
                              geometry.handle.axis === "x"
                                ? geometry.handle.y
                                : geometry.handle.y + 3
                            }
                            stroke="#2563eb"
                            strokeWidth="2"
                            strokeLinecap="round"
                            vectorEffect="non-scaling-stroke"
                            pointerEvents="none"
                          />
                        </g>
                      )}
                    </g>
                  );
                })}

                {liveWireStart && wirePreview && (
                  <path
                    data-editor-only="true"
                    d={wirePath(liveWireStart, wirePreview, wireRoute)}
                    fill="none"
                    stroke="#2563eb"
                    strokeWidth="2.4"
                    strokeLinecap="butt"
                    strokeLinejoin="miter"
                    strokeDasharray="7 5"
                    pointerEvents="none"
                  />
                )}
              </g>

              <g className="component-layer">
                {components.map((component) => {
                  const isSelected =
                    selectedComponentIds.includes(component.id);
                  const leftPortActive =
                    wireStart?.componentId === component.id &&
                    wireStart?.port === "left";
                  const rightPortActive =
                    wireStart?.componentId === component.id &&
                    wireStart?.port === "right";
                  const leftPortSnapTarget =
                    mode === "wire" &&
                    wireStart &&
                    wireSnapTarget?.componentId === component.id &&
                    wireSnapTarget?.port === "left";
                  const rightPortSnapTarget =
                    mode === "wire" &&
                    wireStart &&
                    wireSnapTarget?.componentId === component.id &&
                    wireSnapTarget?.port === "right";
                  const tapPortActive =
                    wireStart?.componentId === component.id &&
                    wireStart?.port === "tap";
                  const tapPortSnapTarget =
                    mode === "wire" &&
                    wireStart &&
                    wireSnapTarget?.componentId === component.id &&
                    wireSnapTarget?.port === "tap";
                  const topPortActive =
                    wireStart?.componentId === component.id &&
                    wireStart?.port === "top";
                  const bottomPortActive =
                    wireStart?.componentId === component.id &&
                    wireStart?.port === "bottom";
                  const wiperPortActive =
                    wireStart?.componentId === component.id &&
                    wireStart?.port === "wiper";
                  const topPortSnapTarget =
                    mode === "wire" &&
                    wireStart &&
                    wireSnapTarget?.componentId === component.id &&
                    wireSnapTarget?.port === "top";
                  const bottomPortSnapTarget =
                    mode === "wire" &&
                    wireStart &&
                    wireSnapTarget?.componentId === component.id &&
                    wireSnapTarget?.port === "bottom";
                  const wiperPortSnapTarget =
                    mode === "wire" &&
                    wireStart &&
                    wireSnapTarget?.componentId === component.id &&
                    wireSnapTarget?.port === "wiper";
                  const portDistance = getComponentPortDistance(component);
                  const isWireSegment = component.type === "wire-segment";
                  const currentArrowOffset = isWireSegment
                    ? getWireCurrentArrowOffset(component, components)
                    : 0;
                  const isVariableWidthComponent =
                    isWireSegment || component.type === "cell";
                  const bodyHalfWidth = isVariableWidthComponent
                    ? portDistance
                    : component.type === "label"
                      ? 80
                      : 50;
                  const hitHalfWidth = isVariableWidthComponent
                    ? bodyHalfWidth + 12
                    : component.type === "label"
                      ? 90
                      : 58;
                  const hitHalfHeight = isWireSegment
                    ? 24
                    : component.type === "label"
                      ? 28
                      : component.type === "potential-divider"
                        ? 56
                        : component.type === "potentiometer"
                          ? 58
                          : 42;
                  const selectionHalfHeight = isWireSegment
                    ? 24
                    : component.type === "label"
                      ? 28
                      : 61;

                  return (
                    <g
                      key={component.id}
                      transform={`translate(${component.x} ${component.y})`}
                    >
                      <g
                        transform={`rotate(${component.rotation})`}
                        className="component"
                        onPointerDown={(event) =>
                          startComponentDrag(event, component)
                        }
                      >
                        {/* A generous invisible hit area makes thin circuit
                            symbols much easier to grab without changing how
                            the exported diagram looks. */}
                        <rect
                          data-editor-only="true"
                          x={-hitHalfWidth}
                          y={-hitHalfHeight}
                          width={hitHalfWidth * 2}
                          height={hitHalfHeight * 2}
                          rx="10"
                          fill="transparent"
                          pointerEvents="all"
                        />

                        {component.type !== "label" && (
                          <CircuitSymbol
                            type={component.type}
                            length={component.length}
                            cellCount={component.cellCount}
                            showPolarity={component.showPolarity ?? true}
                            verticalFlip={component.verticalFlip ?? false}
                            currentArrow={component.currentArrow ?? "none"}
                            currentArrowOffset={currentArrowOffset}
                            componentRotation={component.rotation ?? 0}
                            fancyText={fancyText}
                          />
                        )}

                        <rect
                          data-editor-only="true"
                          x={
                            component.type === "label"
                              ? -90
                              : -(bodyHalfWidth + 11)
                          }
                          y={-selectionHalfHeight}
                          width={
                            component.type === "label"
                              ? 180
                              : (bodyHalfWidth + 11) * 2
                          }
                          height={selectionHalfHeight * 2}
                          rx="8"
                          className="selection-box"
                          opacity={isSelected ? 1 : 0}
                          pointerEvents="none"
                        />

                        {component.type !== "label" &&
                          component.type !== "potentiometer" && (
                          <>
                            {mode === "wire" && (
                              <>
                                <circle
                                  data-editor-only="true"
                                  cx={-portDistance}
                                  cy="0"
                                  r={WIRE_TOOL_SNAP_RADIUS / zoom}
                                  fill="transparent"
                                  stroke="none"
                                  pointerEvents="all"
                                  onPointerDown={(event) =>
                                    handlePortClick(
                                      event,
                                      component.id,
                                      "left"
                                    )
                                  }
                                />
                                <circle
                                  data-editor-only="true"
                                  cx={portDistance}
                                  cy="0"
                                  r={WIRE_TOOL_SNAP_RADIUS / zoom}
                                  fill="transparent"
                                  stroke="none"
                                  pointerEvents="all"
                                  onPointerDown={(event) =>
                                    handlePortClick(
                                      event,
                                      component.id,
                                      "right"
                                    )
                                  }
                                />
                                {component.type === "potential-divider" && (
                                  <circle
                                    data-editor-only="true"
                                    cx="0"
                                    cy={POTENTIAL_DIVIDER_TAP_LENGTH}
                                    r={WIRE_TOOL_SNAP_RADIUS / zoom}
                                    fill="transparent"
                                    stroke="none"
                                    pointerEvents="all"
                                    onPointerDown={(event) =>
                                      handlePortClick(
                                        event,
                                        component.id,
                                        "tap"
                                      )
                                    }
                                  />
                                )}
                              </>
                            )}

                            <circle
                              data-editor-only="true"
                              cx={-portDistance}
                              cy="0"
                              r={
                                leftPortSnapTarget
                                  ? 8
                                  : isWireSegment &&
                                      isSelected &&
                                      mode === "select"
                                    ? 7
                                    : leftPortActive
                                      ? 7
                                      : 5
                              }
                              className={`terminal ${
                                leftPortActive ? "terminal-active" : ""
                              }`}
                              style={{
                                opacity: connectorsVisible ? 1 : 0,
                                pointerEvents: connectorsVisible
                                  ? "auto"
                                  : "none",
                              }}
                              onPointerDown={(event) =>
                                isWireSegment && mode === "select"
                                  ? startWireSegmentResize(
                                      event,
                                      component,
                                      "left"
                                    )
                                  : handlePortClick(
                                      event,
                                      component.id,
                                      "left"
                                    )
                              }
                            />
                            <circle
                              data-editor-only="true"
                              cx={portDistance}
                              cy="0"
                              r={
                                rightPortSnapTarget
                                  ? 8
                                  : isWireSegment &&
                                      isSelected &&
                                      mode === "select"
                                    ? 7
                                    : rightPortActive
                                      ? 7
                                      : 5
                              }
                              className={`terminal ${
                                rightPortActive ? "terminal-active" : ""
                              }`}
                              style={{
                                opacity: connectorsVisible ? 1 : 0,
                                pointerEvents: connectorsVisible
                                  ? "auto"
                                  : "none",
                              }}
                              onPointerDown={(event) =>
                                isWireSegment && mode === "select"
                                  ? startWireSegmentResize(
                                      event,
                                      component,
                                      "right"
                                    )
                                  : handlePortClick(
                                      event,
                                      component.id,
                                      "right"
                                    )
                              }
                            />

                            {component.type === "potential-divider" && (
                              <circle
                                data-editor-only="true"
                                cx="0"
                                cy={POTENTIAL_DIVIDER_TAP_LENGTH}
                                r={
                                  tapPortSnapTarget
                                    ? 8
                                    : tapPortActive
                                      ? 7
                                      : 5
                                }
                                className={`terminal ${
                                  tapPortActive ? "terminal-active" : ""
                                }`}
                              style={{
                                opacity: connectorsVisible ? 1 : 0,
                                pointerEvents: connectorsVisible
                                  ? "auto"
                                  : "none",
                              }}
                                onPointerDown={(event) =>
                                  handlePortClick(
                                    event,
                                    component.id,
                                    "tap"
                                  )
                                }
                              />
                            )}
                          </>
                        )}

                        {component.type === "potentiometer" && (
                          <>
                            {mode === "wire" && (
                              <>
                                <circle
                                  data-editor-only="true"
                                  cx="0"
                                  cy={-PORT_DISTANCE}
                                  r={WIRE_TOOL_SNAP_RADIUS / zoom}
                                  fill="transparent"
                                  stroke="none"
                                  pointerEvents="all"
                                  onPointerDown={(event) =>
                                    handlePortClick(
                                      event,
                                      component.id,
                                      "top"
                                    )
                                  }
                                />
                                <circle
                                  data-editor-only="true"
                                  cx="0"
                                  cy={PORT_DISTANCE}
                                  r={WIRE_TOOL_SNAP_RADIUS / zoom}
                                  fill="transparent"
                                  stroke="none"
                                  pointerEvents="all"
                                  onPointerDown={(event) =>
                                    handlePortClick(
                                      event,
                                      component.id,
                                      "bottom"
                                    )
                                  }
                                />
                                <circle
                                  data-editor-only="true"
                                  cx={PORT_DISTANCE}
                                  cy={component.verticalFlip ? -40 : 40}
                                  r={WIRE_TOOL_SNAP_RADIUS / zoom}
                                  fill="transparent"
                                  stroke="none"
                                  pointerEvents="all"
                                  onPointerDown={(event) =>
                                    handlePortClick(
                                      event,
                                      component.id,
                                      "wiper"
                                    )
                                  }
                                />
                              </>
                            )}

                            <circle
                              data-editor-only="true"
                              cx="0"
                              cy={-PORT_DISTANCE}
                              r={
                                topPortSnapTarget
                                  ? 8
                                  : topPortActive
                                    ? 7
                                    : 5
                              }
                              className={`terminal ${
                                topPortActive ? "terminal-active" : ""
                              }`}
                              style={{
                                opacity: connectorsVisible ? 1 : 0,
                                pointerEvents: connectorsVisible
                                  ? "auto"
                                  : "none",
                              }}
                              onPointerDown={(event) =>
                                handlePortClick(
                                  event,
                                  component.id,
                                  "top"
                                )
                              }
                            />
                            <circle
                              data-editor-only="true"
                              cx="0"
                              cy={PORT_DISTANCE}
                              r={
                                bottomPortSnapTarget
                                  ? 8
                                  : bottomPortActive
                                    ? 7
                                    : 5
                              }
                              className={`terminal ${
                                bottomPortActive ? "terminal-active" : ""
                              }`}
                              style={{
                                opacity: connectorsVisible ? 1 : 0,
                                pointerEvents: connectorsVisible
                                  ? "auto"
                                  : "none",
                              }}
                              onPointerDown={(event) =>
                                handlePortClick(
                                  event,
                                  component.id,
                                  "bottom"
                                )
                              }
                            />
                            <circle
                              data-editor-only="true"
                              cx={PORT_DISTANCE}
                              cy={component.verticalFlip ? -40 : 40}
                              r={
                                wiperPortSnapTarget
                                  ? 8
                                  : wiperPortActive
                                    ? 7
                                    : 5
                              }
                              className={`terminal ${
                                wiperPortActive ? "terminal-active" : ""
                              }`}
                              style={{
                                opacity: connectorsVisible ? 1 : 0,
                                pointerEvents: connectorsVisible
                                  ? "auto"
                                  : "none",
                              }}
                              onPointerDown={(event) =>
                                handlePortClick(
                                  event,
                                  component.id,
                                  "wiper"
                                )
                              }
                            />
                          </>
                        )}
                      </g>

                      {component.type === "potential-divider" &&
                        [1, 2].map((index) => {
                          const field =
                            index === 1
                              ? "dividerLabel1"
                              : "dividerLabel2";
                          const value = component[field];
                          if (!value) return null;

                          const labelLayout =
                            getPotentialDividerLabelLayout(
                              component,
                              index
                            );

                          return (
                            <CircuitLabelText
                              key={field}
                              label={value}
                              x={labelLayout.x}
                              y={labelLayout.y}
                              textAnchor={labelLayout.textAnchor}
                              fontSize={
                                component.labelFontSize ?? 24
                              }
                              fontWeight={
                                component.labelBold ? 700 : 400
                              }
                              fontStyle={
                                component.labelItalic
                                  ? "italic"
                                  : "normal"
                              }
                              fontFamily={circuitTextFontFamily}
                              onPointerDown={(event) =>
                                startComponentDrag(event, component)
                              }
                            />
                          );
                        })}

                      {component.type !== "potential-divider" &&
                        component.type !== "wire-segment" &&
                        component.label &&
                        (() => {
                          const labelLayout =
                            getComponentLabelLayout(component);

                          return (
                            <CircuitLabelText
                              label={component.label}
                              x={labelLayout.x}
                              y={labelLayout.y}
                              textAnchor={labelLayout.textAnchor}
                              fontSize={
                                component.labelFontSize ??
                                (component.type === "label" ? 26 : 24)
                              }
                              fontWeight={
                                component.labelBold ? 700 : 400
                              }
                              fontStyle={
                                component.labelItalic
                                  ? "italic"
                                  : "normal"
                              }
                              fontFamily={circuitTextFontFamily}
                              onPointerDown={(event) =>
                                startComponentDrag(event, component)
                              }
                            />
                          );
                        })()}
                    </g>
                  );
                })}

                {mode === "select" &&
                  selectedComponents
                    .filter(
                      (component) =>
                        component.type === "wire-segment"
                    )
                    .map((component) => {
                      const portDistance =
                        getComponentPortDistance(component);

                      return (
                        <g
                          key={`${component.id}-priority-wire-handles`}
                          data-editor-only="true"
                          transform={`translate(${component.x} ${component.y}) rotate(${component.rotation})`}
                        >
                          {["left", "right"].map((end) => {
                            const x =
                              end === "left"
                                ? -portDistance
                                : portDistance;

                            return (
                              <g key={end}>
                                <circle
                                  cx={x}
                                  cy="0"
                                  r="16"
                                  fill="transparent"
                                  stroke="none"
                                  pointerEvents="all"
                                  style={{ cursor: "pointer" }}
                                  onPointerDown={(event) =>
                                    startWireSegmentResize(
                                      event,
                                      component,
                                      end
                                    )
                                  }
                                />
                                {connectorsVisible && (
                                  <circle
                                    cx={x}
                                    cy="0"
                                    r="7"
                                    className="terminal"
                                    pointerEvents="none"
                                  />
                                )}
                              </g>
                            );
                          })}
                        </g>
                      );
                    })}
              </g>

              {marqueeSelection?.started && (
                <rect
                  data-editor-only="true"
                  x={Math.min(
                    marqueeSelection.startX,
                    marqueeSelection.currentX
                  )}
                  y={Math.min(
                    marqueeSelection.startY,
                    marqueeSelection.currentY
                  )}
                  width={Math.abs(
                    marqueeSelection.currentX -
                      marqueeSelection.startX
                  )}
                  height={Math.abs(
                    marqueeSelection.currentY -
                      marqueeSelection.startY
                  )}
                  rx="4"
                  fill="rgba(37, 99, 235, 0.10)"
                  stroke="#2563eb"
                  strokeWidth="1.5"
                  strokeDasharray="7 5"
                  vectorEffect="non-scaling-stroke"
                  pointerEvents="none"
                />
              )}

              {!components.length && (
                <g
                  data-editor-only="true"
                  className="empty-state"
                  pointerEvents="none"
                >
                  <text x={WIDTH / 2} y={HEIGHT / 2 - 14}>
                    Drag a circuit symbol, wire or label here
                  </text>
                  <text x={WIDTH / 2} y={HEIGHT / 2 + 20}>
                    or click one in the palette
                  </text>
                </g>
              )}
              </svg>
            </div>
          </div>
        </section>

        <aside className="inspector">
          <h2>Inspector</h2>

          {selectedComponentIds.length > 1 ? (
            <>
              <p className="selected-name">
                {selectedComponentIds.length} components selected
              </p>
              <p className="hint">
                Drag any selected component to move the whole group. Use Rotate
                to turn the selection around its centre. Shift-click another
                component to add or remove it.
              </p>
            </>
          ) : selectedComponent ? (
            <>
              <div className="inspector-symbol">
                <PaletteIcon type={selectedComponent.type} />
              </div>
              <p className="selected-name">
                {
                  SYMBOLS.find(
                    (symbol) => symbol.type === selectedComponent.type
                  )?.label
                }
              </p>

              {["switch-open", "switch-closed"].includes(
                selectedComponent.type
              ) && (
                <div style={{ marginBottom: "18px" }}>
                  <div
                    style={{
                      marginBottom: "6px",
                      fontSize: "12px",
                      color: "#5d6e84",
                    }}
                  >
                    Switch state
                  </div>

                  <div
                    aria-label="Switch state"
                    style={{
                      display: "grid",
                      gridTemplateColumns: "repeat(2, minmax(0, 1fr))",
                      gap: "6px",
                    }}
                  >
                    <button
                      type="button"
                      className={
                        selectedComponent.type === "switch-open"
                          ? "active"
                          : ""
                      }
                      onClick={() =>
                        setSelectedSwitchState("open")
                      }
                    >
                      Open
                    </button>

                    <button
                      type="button"
                      className={
                        selectedComponent.type === "switch-closed"
                          ? "active"
                          : ""
                      }
                      onClick={() =>
                        setSelectedSwitchState("closed")
                      }
                    >
                      Closed
                    </button>
                  </div>
                </div>
              )}

              {selectedComponent.type === "wire-segment" && (
                <div
                  style={{
                    marginBottom: "12px",
                    padding: "7px 9px",
                    border: "1px solid #dfe6ef",
                    borderRadius: "9px",
                    background: "#f8fafc",
                    display: "grid",
                    gridTemplateColumns: "1fr auto",
                    alignItems: "center",
                    gap: "10px",
                  }}
                >
                  <span
                    style={{
                      fontSize: "12px",
                      fontWeight: 650,
                      color: "#526275",
                    }}
                  >
                    Current arrow
                  </span>

                  <div
                    aria-label="Current arrow direction"
                    style={{
                      display: "grid",
                      gridTemplateColumns: "repeat(3, 34px)",
                      border: "1px solid #d5deea",
                      borderRadius: "7px",
                      overflow: "hidden",
                      background: "white",
                    }}
                  >
                    {[
                      { value: "none", label: "–", title: "No current arrow" },
                      { value: "left", label: "←", title: "Current arrow left" },
                      { value: "right", label: "→", title: "Current arrow right" },
                    ].map((option, index) => (
                      <button
                        key={option.value}
                        type="button"
                        className={
                          (selectedComponent.currentArrow ?? "none") ===
                          option.value
                            ? "active"
                            : ""
                        }
                        onClick={() =>
                          setSelectedWireCurrentArrow(option.value)
                        }
                        title={option.title}
                        aria-label={option.title}
                        style={{
                          minWidth: 0,
                          height: "28px",
                          padding: 0,
                          border: 0,
                          borderLeft:
                            index === 0
                              ? 0
                              : "1px solid #e2e8f0",
                          borderRadius: 0,
                          fontSize:
                            option.value === "none"
                              ? "16px"
                              : "19px",
                          lineHeight: 1,
                        }}
                      >
                        {option.label}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {selectedComponent.type === "potentiometer" && (
                <div
                  style={{
                    marginBottom: "12px",
                    padding: "7px 9px",
                    border: "1px solid #dfe6ef",
                    borderRadius: "9px",
                    background: "#f8fafc",
                    display: "grid",
                    gridTemplateColumns: "1fr auto",
                    alignItems: "center",
                    gap: "10px",
                  }}
                >
                  <span
                    style={{
                      fontSize: "12px",
                      fontWeight: 650,
                      color: "#526275",
                    }}
                  >
                    Wiper lead
                  </span>
                  <button
                    type="button"
                    onClick={flipSelectedPotentiometerVertically}
                    title="Flip the wiper lead"
                    aria-label="Flip wiper lead"
                    style={{
                      padding: "6px 10px",
                      whiteSpace: "nowrap",
                    }}
                  >
                    Flip
                  </button>
                </div>
              )}

              {["cell", "battery"].includes(
                selectedComponent.type
              ) && (
                <div
                  style={{
                    marginBottom: "12px",
                    padding: "7px 9px",
                    border: "1px solid #dfe6ef",
                    borderRadius: "9px",
                    background: "#f8fafc",
                    display: "grid",
                    gap: "6px",
                  }}
                >
                  {selectedComponent.type === "cell" && (
                    <div
                      style={{
                        minHeight: "28px",
                        display: "grid",
                        gridTemplateColumns: "1fr auto",
                        alignItems: "center",
                        gap: "10px",
                      }}
                    >
                      <span
                        style={{
                          fontSize: "12px",
                          fontWeight: 650,
                          color: "#526275",
                        }}
                      >
                        Cells
                      </span>

                      <div
                        aria-label="Number of cells"
                        title="Number of cells"
                        style={{
                          display: "grid",
                          gridTemplateColumns: "28px 30px 28px",
                          alignItems: "center",
                          border: "1px solid #d5deea",
                          borderRadius: "7px",
                          overflow: "hidden",
                          background: "white",
                        }}
                      >
                        <button
                          type="button"
                          onClick={() => adjustSelectedCellCount(-1)}
                          disabled={
                            (selectedComponent.cellCount ?? 1) <=
                            CELL_COUNT_MIN
                          }
                          title="Remove one cell"
                          aria-label="Remove one cell"
                          style={{
                            minWidth: 0,
                            height: "26px",
                            padding: 0,
                            border: 0,
                            borderRight: "1px solid #e2e8f0",
                            borderRadius: 0,
                            fontSize: "17px",
                            lineHeight: 1,
                            background: "transparent",
                          }}
                        >
                          −
                        </button>

                        <div
                          aria-live="polite"
                          style={{
                            textAlign: "center",
                            fontSize: "13px",
                            fontWeight: 700,
                            fontVariantNumeric: "tabular-nums",
                          }}
                        >
                          {selectedComponent.cellCount ?? 1}
                        </div>

                        <button
                          type="button"
                          onClick={() => adjustSelectedCellCount(1)}
                          disabled={
                            (selectedComponent.cellCount ?? 1) >=
                            CELL_COUNT_MAX
                          }
                          title="Add one cell"
                          aria-label="Add one cell"
                          style={{
                            minWidth: 0,
                            height: "26px",
                            padding: 0,
                            border: 0,
                            borderLeft: "1px solid #e2e8f0",
                            borderRadius: 0,
                            fontSize: "17px",
                            lineHeight: 1,
                            background: "transparent",
                          }}
                        >
                          +
                        </button>
                      </div>
                    </div>
                  )}

                  <label
                    style={{
                      minHeight: "28px",
                      display: "grid",
                      gridTemplateColumns: "1fr auto",
                      alignItems: "center",
                      gap: "10px",
                      cursor: "pointer",
                    }}
                  >
                    <span
                      style={{
                        fontSize: "12px",
                        fontWeight: 650,
                        color: "#526275",
                      }}
                    >
                      Show +
                    </span>

                    <input
                      type="checkbox"
                      checked={selectedComponent.showPolarity ?? true}
                      onChange={(event) =>
                        setSelectedPolarityMark(event.target.checked)
                      }
                      aria-label="Show positive polarity mark"
                      style={{
                        width: "16px",
                        height: "16px",
                        margin: 0,
                        accentColor: "#2563eb",
                        cursor: "pointer",
                      }}
                    />
                  </label>
                </div>
              )}

              {selectedComponent.type !== "wire-segment" &&
                (selectedComponent.type === "potential-divider" ? (
                <div
                  style={{
                    display: "grid",
                    gap: "10px",
                  }}
                >
                  <label>
                    Resistor 1
                    <input
                      ref={dividerLabel1InputRef}
                      value={selectedComponent.dividerLabel1 ?? ""}
                      onFocus={(event) =>
                        rememberLabelSelection(
                          event,
                          "dividerLabel1"
                        )
                      }
                      onChange={(event) => {
                        updateSelectedLabelField(
                          "dividerLabel1",
                          event.target.value
                        );
                        rememberLabelSelection(
                          event,
                          "dividerLabel1"
                        );
                      }}
                      onSelect={(event) =>
                        rememberLabelSelection(
                          event,
                          "dividerLabel1"
                        )
                      }
                      onClick={(event) =>
                        rememberLabelSelection(
                          event,
                          "dividerLabel1"
                        )
                      }
                      onKeyUp={(event) =>
                        rememberLabelSelection(
                          event,
                          "dividerLabel1"
                        )
                      }
                      placeholder="e.g. R₁ or 1 kΩ"
                      style={{
                        fontSize: "18px",
                        padding: "10px 12px",
                        minHeight: "44px",
                        fontWeight: selectedComponent.labelBold
                          ? 700
                          : 400,
                        fontStyle: selectedComponent.labelItalic
                          ? "italic"
                          : "normal",
                      }}
                    />
                  </label>

                  <label>
                    Resistor 2
                    <input
                      ref={dividerLabel2InputRef}
                      value={selectedComponent.dividerLabel2 ?? ""}
                      onFocus={(event) =>
                        rememberLabelSelection(
                          event,
                          "dividerLabel2"
                        )
                      }
                      onChange={(event) => {
                        updateSelectedLabelField(
                          "dividerLabel2",
                          event.target.value
                        );
                        rememberLabelSelection(
                          event,
                          "dividerLabel2"
                        );
                      }}
                      onSelect={(event) =>
                        rememberLabelSelection(
                          event,
                          "dividerLabel2"
                        )
                      }
                      onClick={(event) =>
                        rememberLabelSelection(
                          event,
                          "dividerLabel2"
                        )
                      }
                      onKeyUp={(event) =>
                        rememberLabelSelection(
                          event,
                          "dividerLabel2"
                        )
                      }
                      placeholder="e.g. R₂ or 2 kΩ"
                      style={{
                        fontSize: "18px",
                        padding: "10px 12px",
                        minHeight: "44px",
                        fontWeight: selectedComponent.labelBold
                          ? 700
                          : 400,
                        fontStyle: selectedComponent.labelItalic
                          ? "italic"
                          : "normal",
                      }}
                    />
                  </label>
                </div>
              ) : (
                <label>
                  Label
                  <input
                    ref={labelInputRef}
                    value={selectedComponent.label}
                    onFocus={(event) =>
                      rememberLabelSelection(event, "label")
                    }
                    onChange={(event) => {
                      updateSelectedLabel(event.target.value);
                      rememberLabelSelection(event, "label");
                    }}
                    onSelect={(event) =>
                      rememberLabelSelection(event, "label")
                    }
                    onClick={(event) =>
                      rememberLabelSelection(event, "label")
                    }
                    onKeyUp={(event) =>
                      rememberLabelSelection(event, "label")
                    }
                    placeholder="e.g. 220 Ω, 10 µF, 25 °C"
                    style={{
                      fontSize: "18px",
                      padding: "12px 14px",
                      minHeight: "48px",
                      fontWeight: selectedComponent.labelBold
                        ? 700
                        : 400,
                      fontStyle: selectedComponent.labelItalic
                        ? "italic"
                        : "normal",
                    }}
                  />
                </label>
              ))}

              {selectedComponent.type !== "wire-segment" && (
                <>
              <div
                aria-label="Insert common physics characters"
                style={{
                  display: "grid",
                  gridTemplateColumns: "repeat(4, minmax(0, 1fr))",
                  gap: "6px",
                  marginTop: "10px",
                }}
              >
                {LABEL_CHARACTERS.map(({ character, name }) => (
                  <button
                    key={character}
                    type="button"
                    title={`Insert ${name} (${character})`}
                    aria-label={`Insert ${name}`}
                    onMouseDown={(event) => {
                      // Keep the label input's cursor/selection in place.
                      event.preventDefault();
                    }}
                    onClick={() => insertLabelCharacter(character)}
                    style={{
                      padding: "7px 4px",
                      fontSize: "₁₂₃₄₅".includes(character)
                        ? "18px"
                        : "16px",
                      lineHeight: 1,
                    }}
                  >
                    {character}
                  </button>
                ))}
              </div>

              <p
                className="hint"
                style={{ marginTop: "7px", marginBottom: 0 }}
              >
                Useful common symbols
              </p>
                </>
              )}

              {!["label", "potential-divider", "wire-segment"].includes(
                selectedComponent.type
              ) && (
                <>
                  <div
                    style={{
                      marginTop: "16px",
                      marginBottom: "6px",
                      fontSize: "12px",
                      color: "#5d6e84",
                    }}
                  >
                    Label position
                  </div>

                  <div
                    aria-label="Label position"
                    style={{
                      display: "grid",
                      gridTemplateColumns: "repeat(4, minmax(0, 1fr))",
                      gap: "6px",
                    }}
                  >
                    {LABEL_POSITIONS.map(({ value, symbol, name }) => (
                      <button
                        key={value}
                        type="button"
                        className={
                          (selectedComponent.labelPosition ?? "below") ===
                          value
                            ? "active"
                            : ""
                        }
                        title={`Put label ${name.toLowerCase()}`}
                        aria-label={`Put label ${name.toLowerCase()}`}
                        onClick={() =>
                          updateSelectedLabelPosition(value)
                        }
                        style={{
                          padding: "7px 4px",
                          fontSize: "18px",
                          lineHeight: 1,
                        }}
                      >
                        {symbol}
                      </button>
                    ))}
                  </div>
                </>
              )}

              {selectedComponent.type !== "wire-segment" && (
                <>
              <div
                style={{
                  marginTop: "16px",
                  marginBottom: "6px",
                  fontSize: "12px",
                  color: "#5d6e84",
                }}
              >
                Font size
              </div>

              <div
                aria-label="Label font size"
                style={{
                  display: "grid",
                  gridTemplateColumns: "repeat(2, minmax(0, 1fr))",
                  gap: "6px",
                }}
              >
                <button
                  type="button"
                  title="Decrease font size"
                  aria-label="Decrease font size"
                  onClick={() => adjustSelectedLabelFontSize(-1)}
                  style={{
                    padding: "7px 4px",
                    fontSize: "20px",
                    lineHeight: 1,
                  }}
                >
                  A−
                </button>
                <button
                  type="button"
                  title="Increase font size"
                  aria-label="Increase font size"
                  onClick={() => adjustSelectedLabelFontSize(1)}
                  style={{
                    padding: "7px 4px",
                    fontSize: "20px",
                    lineHeight: 1,
                  }}
                >
                  A+
                </button>
              </div>

              <div
                aria-label="Label text style"
                style={{
                  display: "grid",
                  gridTemplateColumns: "repeat(2, minmax(0, 1fr))",
                  gap: "6px",
                  marginTop: "6px",
                }}
              >
                <button
                  type="button"
                  className={selectedComponent.labelBold ? "active" : ""}
                  title="Bold label"
                  aria-label="Bold label"
                  aria-pressed={Boolean(selectedComponent.labelBold)}
                  onClick={() => toggleSelectedLabelStyle("bold")}
                  style={{
                    padding: "7px 4px",
                    fontSize: "18px",
                    fontWeight: 800,
                    lineHeight: 1,
                  }}
                >
                  B
                </button>
                <button
                  type="button"
                  className={selectedComponent.labelItalic ? "active" : ""}
                  title="Italic label"
                  aria-label="Italic label"
                  aria-pressed={Boolean(selectedComponent.labelItalic)}
                  onClick={() => toggleSelectedLabelStyle("italic")}
                  style={{
                    padding: "7px 4px",
                    fontSize: "18px",
                    fontStyle: "italic",
                    lineHeight: 1,
                  }}
                >
                  I
                </button>
              </div>
                </>
              )}

              <dl className="properties">
                <div>
                  <dt>Rotation</dt>
                  <dd>{selectedComponent.rotation}°</dd>
                </div>
                <div>
                  <dt>Position</dt>
                  <dd>
                    {Math.round(selectedComponent.x)},{" "}
                    {Math.round(selectedComponent.y)}
                  </dd>
                </div>
              </dl>

              <p className="hint">
                {selectedComponent.type === "label"
                  ? "Drag this annotation anywhere on the page."
                  : selectedComponent.type === "wire-segment"
                    ? "Drag either blue end to change this wire's length. In Wire mode, those ends can also be used as connection terminals."
                    : "Blue dots are connection terminals. Switch to Wire mode, then click two terminals."}
              </p>
            </>
          ) : selected?.kind === "wire" ? (
            <>
              <p className="selected-name">Wire selected</p>

              <div
                style={{
                  marginBottom: "12px",
                  padding: "7px 9px",
                  border: "1px solid #dfe6ef",
                  borderRadius: "9px",
                  background: "#f8fafc",
                  display: "grid",
                  gridTemplateColumns: "1fr auto",
                  alignItems: "center",
                  gap: "10px",
                }}
              >
                <span
                  style={{
                    fontSize: "12px",
                    fontWeight: 650,
                    color: "#526275",
                  }}
                >
                  Current arrows
                </span>

                <div
                  aria-label="Current arrow direction"
                  style={{
                    display: "grid",
                    gridTemplateColumns: "repeat(3, 34px)",
                    border: "1px solid #d5deea",
                    borderRadius: "7px",
                    overflow: "hidden",
                    background: "white",
                  }}
                >
                  {[
                    {
                      value: "none",
                      label: "–",
                      title: "No current arrows",
                    },
                    {
                      value: "reverse",
                      label: "←",
                      title: "Reverse current direction",
                    },
                    {
                      value: "forward",
                      label: "→",
                      title: "Forward current direction",
                    },
                  ].map((option, index) => (
                    <button
                      key={option.value}
                      type="button"
                      className={
                        (selectedWire?.currentArrow ?? "none") ===
                        option.value
                          ? "active"
                          : ""
                      }
                      onClick={() =>
                        setSelectedDrawnWireCurrentArrow(
                          option.value
                        )
                      }
                      title={option.title}
                      aria-label={option.title}
                      style={{
                        minWidth: 0,
                        height: "28px",
                        padding: 0,
                        border: 0,
                        borderLeft:
                          index === 0
                            ? 0
                            : "1px solid #e2e8f0",
                        borderRadius: 0,
                        fontSize:
                          option.value === "none"
                            ? "16px"
                            : "19px",
                        lineHeight: 1,
                      }}
                    >
                      {option.label}
                    </button>
                  ))}
                </div>
              </div>

              {selectedWireCanFlip && (
                <div
                  style={{
                    marginBottom: "12px",
                    padding: "7px 9px",
                    border: "1px solid #dfe6ef",
                    borderRadius: "9px",
                    background: "#f8fafc",
                    display: "grid",
                    gridTemplateColumns: "1fr auto",
                    alignItems: "center",
                    gap: "10px",
                  }}
                >
                  <span
                    style={{
                      fontSize: "12px",
                      fontWeight: 650,
                      color: "#526275",
                    }}
                  >
                    Corner route
                  </span>
                  <button
                    type="button"
                    onClick={flipWireCorner}
                    title="Flip the wire corner (Space)"
                    aria-label="Flip wire corner"
                    style={{
                      minWidth: "72px",
                      padding: "6px 10px",
                    }}
                  >
                    Flip
                  </button>
                </div>
              )}

              <p className="hint">
                {selectedWire?.route === "c-shape"
                  ? "Drag the blue handle on the middle segment to move the C-shaped wire in or out."
                  : selectedWireCanFlip
                    ? "Use Flip above or press Space to switch to the other corner. Press Delete to remove the wire."
                    : "Press Delete to remove the wire."}
              </p>
            </>
          ) : (
            <p className="hint">
              Select a component to edit it. Shift-click components to select
              several and drag them together.
            </p>
          )}
        </aside>
      </main>
    </div>
  );
}

export default App;
